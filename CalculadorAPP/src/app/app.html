<div style="font-family: sans-serif; padding: 20px;">
  <h2>Mi Calculadora</h2>

  <div style="margin-bottom: 10px;">
    <label>Num 1: </label>
    <input type="number" [(ngModel)]="num1">
  </div>

  <div style="margin-bottom: 10px;">
    <label>Op. </label>
    <select [(ngModel)]="operacion">
      <option value="+">+</option>
      <option value="-">-</option>
      <option value="*">*</option>
      <option value="/">/</option>
    </select>
  </div>

  <div style="margin-bottom: 10px;">
    <label>Num 2: </label>
    <input type="number" [(ngModel)]="num2">
  </div>

  <button (click)="calcular()" style="margin: 10px 0; padding: 5px 15px;">Operar</button>

  <h3>Resultado = {{ resultado }}</h3>

  <hr>

  <h4>Historial</h4>
  <ul>
    @for (item of historial; track $index) {
      <li>{{ item }}</li>
    }
  </ul>
</div>
